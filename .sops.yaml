# Refer to https://github.com/viaduct-ai/kustomize-sops
creation_rules:
  - path_regex: "^dev/.*"
    unencrypted_regex: "^(apiVersion|metadata|kind|type)$"
    # The age public key(s) that secrets are encrypted to. Comma separated.
    #
    # !!! REPLACE THIS with your own public key (starts with "age1") !!!
    # See "Setup sops / age" in README.md.
    #
    # The key below is a placeholder. Its private key was thrown away on purpose,
    # so nobody can decrypt anything encrypted to it.
    # If you forget to replace it, ArgoCD fails to decrypt your secrets
    # instead of silently using a key that anyone can read.
    age: >-
      age1vmdd36aglc6hrrsftehwlh5cue5p6nveqcf8c9457jrg28cjcefstkwjwe

